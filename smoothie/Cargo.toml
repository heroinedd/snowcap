[package]
name = "smoothie_main"
version = "0.1.0"
authors = ["Dan Wang <dan-wang@stu.xjtu.edu.cn>"]
edition = "2018"
default-run = "smoothie_main"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
snowcap = { path = "../snowcap", features = ["count-states"] }
snowcap_main = { path = "../snowcap_main" }
pretty_env_logger = "0.4"
log = "0.4.11"
glob = "0.3.2"
serde_json = "1.0.59"
serde = { version = "1.0.117", features = ["derive"] }
